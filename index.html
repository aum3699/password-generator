<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
<h1>Generate a <br><span>Random Password</span></h1>
<div class="display">
<input type="text" id="password" placeholder="Your Password" readonly>
<img src="images/copy.png" alt="copy" id="copy-btn">
</div>
<button class="generate-btn"><img src="images/generate.png" alt="generate">Generate Password</button>
</div>

<script>
const generateBtn = document.querySelector('.generate-btn');
const copyBtn = document.getElementById('copy-btn');
const passwordInput = document.getElementById('password');

function generatePassword() {
    const length = 12;
    const charset = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()_+~`|}{[]:;?><,./-=";
    let password = "";
    for (let i = 0; i < length; i++) {
        const randomIndex = Math.floor(Math.random() * charset.length);
        password += charset[randomIndex];
    }
    passwordInput.value = password;
}

function copyPassword() {
    passwordInput.select();
    document.execCommand('copy');
    // Optional: show visual feedback
    copyBtn.style.opacity = '0.3';
    setTimeout(() => {
        copyBtn.style.opacity = '0.7';
    }, 200);
}

generateBtn.addEventListener('click', generatePassword);
copyBtn.addEventListener('click', copyPassword);
generatePassword();
</script>
</body>
</html>
